<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="TensCUDA Monitor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2740"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ec4b6"/>
      <stop offset="45%" stop-color="#7dcf6e"/>
      <stop offset="100%" stop-color="#f0a202"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ec4b6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2ec4b6" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="die">
      <rect x="40" y="40" width="48" height="48" rx="6"/>
    </clipPath>
  </defs>

  <!-- app tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>

  <!-- chip body -->
  <rect x="36" y="36" width="56" height="56" rx="10" fill="#141c28" stroke="#3a4a5e" stroke-width="2.5"/>

  <!-- pins -->
  <g fill="#5a6a7e">
    <rect x="44" y="28" width="5" height="8" rx="1.5"/><rect x="54" y="28" width="5" height="8" rx="1.5"/>
    <rect x="64" y="28" width="5" height="8" rx="1.5"/><rect x="74" y="28" width="5" height="8" rx="1.5"/>
    <rect x="44" y="92" width="5" height="8" rx="1.5"/><rect x="54" y="92" width="5" height="8" rx="1.5"/>
    <rect x="64" y="92" width="5" height="8" rx="1.5"/><rect x="74" y="92" width="5" height="8" rx="1.5"/>
    <rect x="28" y="44" width="8" height="5" rx="1.5"/><rect x="28" y="54" width="8" height="5" rx="1.5"/>
    <rect x="28" y="64" width="8" height="5" rx="1.5"/><rect x="28" y="74" width="8" height="5" rx="1.5"/>
    <rect x="92" y="44" width="8" height="5" rx="1.5"/><rect x="92" y="54" width="8" height="5" rx="1.5"/>
    <rect x="92" y="64" width="8" height="5" rx="1.5"/><rect x="92" y="74" width="8" height="5" rx="1.5"/>
  </g>

  <!-- tensix-ish die grid -->
  <g fill="#0b1218" clip-path="url(#die)">
    <rect x="40" y="40" width="48" height="48" rx="6" fill="#0e1622"/>
    <g opacity="0.9">
      <rect x="44" y="44" width="8" height="8" rx="1.5"/><rect x="56" y="44" width="8" height="8" rx="1.5"/>
      <rect x="68" y="44" width="8" height="8" rx="1.5"/><rect x="80" y="44" width="8" height="8" rx="1.5"/>
      <rect x="44" y="56" width="8" height="8" rx="1.5"/><rect x="56" y="56" width="8" height="8" rx="1.5"/>
      <rect x="68" y="56" width="8" height="8" rx="1.5"/><rect x="80" y="56" width="8" height="8" rx="1.5"/>
      <rect x="44" y="68" width="8" height="8" rx="1.5"/><rect x="56" y="68" width="8" height="8" rx="1.5"/>
      <rect x="68" y="68" width="8" height="8" rx="1.5"/><rect x="80" y="68" width="8" height="8" rx="1.5"/>
      <rect x="44" y="80" width="8" height="8" rx="1.5"/><rect x="56" y="80" width="8" height="8" rx="1.5"/>
      <rect x="68" y="80" width="8" height="8" rx="1.5"/><rect x="80" y="80" width="8" height="8" rx="1.5"/>
    </g>
  </g>

  <!-- sparkline fill + stroke -->
  <path d="M42,78 L50,70 L56,74 L66,54 L74,62 L84,44 L86,44 L86,88 L42,88 Z"
        fill="url(#fill)" clip-path="url(#die)"/>
  <polyline points="42,78 50,70 56,74 66,54 74,62 84,44"
            fill="none" stroke="url(#spark)" stroke-width="3.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="84" cy="44" r="4" fill="#f0a202"/>
</svg>
