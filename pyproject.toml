[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenscuda"
version = "0.0.1"
description = "Run unmodified CUDA-style PyTorch scripts on Tenstorrent Blackhole via TT-XLA"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["torch", "torch-xla", "pjrt-plugin-tt"]

[project.optional-dependencies]
hf = ["transformers>=5", "accelerate"]
test = ["pytest"]

[tool.setuptools]
packages = ["tenscuda", "monitor"]

[project.scripts]
tenscuda-monitor = "monitor.app:main"
